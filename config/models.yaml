default_model: kimi

models:
  deepseek:
    model: deepseek-chat
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    api_type: chat_completions

  openai:
    model: gpt-4.1
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    api_type: responses

  kimi:
    model: kimi-k3
    base_url: https://api.moonshot.cn/v1
    api_key_env: KIMI_API_KEY
    api_type: chat_completions